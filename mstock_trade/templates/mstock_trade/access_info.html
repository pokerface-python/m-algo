{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2>Access Information</h2>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Session Information</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <h6>Access Token</h6>
                        <div class="bg-light p-2 rounded">
                            <code style="word-break: break-all;">{{ access_token }}</code>
                        </div>
                    </div>
                    <div class="mb-3">
                        <h6>User ID</h6>
                        <p>{{ user_id }}</p>
                    </div>
                    <div class="mb-3">
                        <h6>User Name</h6>
                        <p>{{ user_name }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
